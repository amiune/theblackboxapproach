<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BlackBoxApproach Visualizer</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>BlackBoxApproach Visualizer</h1>
        <p id="loadStatus" class="status-line">No files loaded</p>
      </div>
      <div class="toolbar" aria-label="Project loading controls">
        <div class="segmented-control" aria-label="Visualizer view mode">
          <button id="processPlotViewButton" class="active" type="button" title="Show process plot">Process Plot</button>
          <button id="dataPlotViewButton" type="button" title="Show data structures plot">Data Structures Plot</button>
          <button id="explorerViewButton" type="button" title="Show explorer view">Explorer</button>
        </div>
        <button id="openFolderButton" type="button" title="Open blackboxes folder">Open Folder</button>
        <button id="uploadFolderButton" type="button" title="Upload a folder">Upload Folder</button>
        <button id="uploadFilesButton" type="button" title="Upload YAML files">Upload YAML</button>
        <button id="commitChangesButton" class="mac-only hidden-view git-action-button" type="button" title="Commit current project changes">Commit</button>
        <button id="discardChangesButton" class="mac-only hidden-view git-action-button danger" type="button" title="Discard current project changes">Discard</button>
      </div>
    </header>

    <main id="explorerWorkspace" class="workspace hidden-view">
      <section class="panel tree-panel" aria-labelledby="treeTitle">
        <div class="panel-header">
          <h2 id="treeTitle">Tree</h2>
          <div class="panel-actions">
            <button id="collapseAllButton" type="button" title="Collapse all boxes">Collapse All</button>
            <button id="expandAllButton" type="button" title="Expand all boxes">Expand All</button>
            <span id="treeCount" class="count-pill">0</span>
          </div>
        </div>
        <div id="treeRoot" class="tree-root" tabindex="0"></div>
        <div id="globalWarnings" class="warning-list"></div>
      </section>

      <section class="panel detail-panel" aria-labelledby="detailTitle">
        <div class="panel-header">
          <h2 id="detailTitle">Selected Box</h2>
          <div class="panel-actions">
            <div class="segmented-control" aria-label="Selected box detail mode">
              <button id="basicViewButton" class="active" type="button" title="Show basic details">Basic</button>
              <button id="advancedViewButton" type="button" title="Show advanced details">Advanced</button>
            </div>
            <span id="selectedBadge" class="count-pill">None</span>
          </div>
        </div>
        <div id="detailRoot" class="detail-root empty-state">Select a box from the tree.</div>
      </section>

      <section class="panel prompt-panel" aria-labelledby="promptTitle">
        <div class="panel-header">
          <h2 id="promptTitle">Prompt Builder</h2>
          <div class="panel-actions">
            <button id="sendPromptButton" class="mac-only hidden-view" type="button" title="Send generated prompt to ChatGPT">Send</button>
            <button id="copyPromptButton" type="button" title="Copy generated prompt">Copy</button>
          </div>
        </div>
        <label class="field-label" for="instructionInput">Instruction</label>
        <textarea id="instructionInput" class="instruction-input" spellcheck="true">Describe the change you want ChatGPT to make.</textarea>
        <label class="field-label" for="promptOutput">Generated prompt</label>
        <textarea id="promptOutput" class="prompt-output" readonly spellcheck="false"></textarea>
      </section>
    </main>

    <main id="plotWorkspace" class="plot-workspace">
      <section class="panel plot-panel" aria-labelledby="plotTitle">
        <div class="panel-header">
          <h2 id="plotTitle">Interactive Plot</h2>
          <div class="panel-actions">
            <div class="segmented-control" aria-label="Plot scope">
              <button id="plotAllButton" class="active" type="button" title="Show all boxes">All</button>
              <button id="plotSelectedButton" type="button" title="Show selected box, parents, and children">Selected</button>
            </div>
            <button id="fitPlotButton" type="button" title="Fit plot to view">Fit</button>
            <span id="plotStatus" class="count-pill">0 nodes</span>
          </div>
        </div>
        <div class="plot-body">
          <svg id="plotSvg" class="plot-svg" role="img" aria-label="Interactive black-box tree plot"></svg>
          <aside id="plotInspector" class="plot-inspector empty-state">Select a node in the plot.</aside>
        </div>
      </section>
    </main>

    <main id="dataPlotWorkspace" class="plot-workspace hidden-view">
      <section class="panel plot-panel" aria-labelledby="dataPlotTitle">
        <div class="panel-header">
          <h2 id="dataPlotTitle">Data Structures Plot</h2>
          <div class="panel-actions">
            <button id="fitDataPlotButton" type="button" title="Fit data plot to view">Fit</button>
            <span id="dataPlotStatus" class="count-pill">0 structures</span>
          </div>
        </div>
        <div class="plot-body full-plot">
          <svg id="dataPlotSvg" class="plot-svg" role="img" aria-label="Interactive data structure relationship plot"></svg>
        </div>
      </section>
    </main>

    <div id="dataModal" class="modal-overlay hidden-view" role="dialog" aria-modal="true" aria-labelledby="dataModalTitle">
      <section class="modal">
        <div class="modal-header">
          <h2 id="dataModalTitle">Data Structure</h2>
          <button id="closeDataModalButton" type="button" title="Close data structure modal">Close</button>
        </div>
        <div id="dataModalBody" class="modal-body"></div>
      </section>
    </div>

    <div id="gitModal" class="modal-overlay hidden-view" role="dialog" aria-modal="true" aria-labelledby="gitModalTitle">
      <section class="modal">
        <div class="modal-header">
          <h2 id="gitModalTitle">Git Changes</h2>
          <button id="closeGitModalButton" type="button" title="Close Git changes modal">Close</button>
        </div>
        <div id="gitModalBody" class="modal-body"></div>
      </section>
    </div>

    <div id="chatModal" class="modal-overlay hidden-view" role="dialog" aria-modal="true" aria-labelledby="chatModalTitle">
      <section class="modal">
        <div class="modal-header">
          <h2 id="chatModalTitle">ChatGPT Result</h2>
          <button id="closeChatModalButton" type="button" title="Close ChatGPT result modal">Close</button>
        </div>
        <div id="chatModalBody" class="modal-body"></div>
      </section>
    </div>

    <input id="folderInput" class="hidden-input" type="file" webkitdirectory multiple>
    <input id="filesInput" class="hidden-input" type="file" accept=".yaml,.yml,.json,.txt,.patch,.diff" multiple>

    <script src="app.js"></script>
  </body>
</html>
