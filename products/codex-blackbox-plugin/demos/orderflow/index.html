      if(item.category==="data")fieldsFor(item,body);else{body.append(el("p",null,item.process||item.description||"No process description is documented."));body.append(disclosure("Inputs",node=>portList(item.inputs,node,`${item.id}:inputs`),`${item.id}:inputs`),disclosure("Outputs",node=>portList(item.outputs,node,`${item.id}:outputs`),`${item.id}:outputs`));}
      metadata(item,body,item.id);
      if(item.implementation)body.append(disclosure("Implementation",node=>{const implementation=item.implementation;node.append(el("code",null,[implementation.path,implementation.symbol].filter(Boolean).join(" · ")),badge(`Authorship: ${names[origin(implementation.provenance)]}`,origin(implementation.provenance)));if(implementation.code){const pre=el("pre");pre.append(el("code",null,implementation.code));node.append(pre);}node.append(sourceNodes(implementation.sources));},`${item.id}:implementation`));
      const related=edges.filter(edge=>edge.source===item.id||edge.target===item.id);
      if(related.length)body.append(disclosure("Connections",node=>{for(const edge of related){const other=entities.get(edge.source===item.id?edge.target:edge.source),row=el("div","related-row");row.append(button(other.label,()=>{if(other.category==="data")openType(other.id);else{const key=state.cardOrigin;closeCard(false);drill(other.id,key);}},"type-link"),el("small",null,edge.label));node.append(row);}},`${item.id}:connections`));
    }
    function renderCard(){
      const context=currentContext();if(!context)return;$("card-content").replaceChildren();$("card-back").hidden=state.cardTrail.length<2;const item=entities.get(context.id),body=$("card-content");
      if(!item){$("card-kind").textContent="Unavailable definition";$("card-title").textContent=context.id;body.append(el("p","muted","This reference has no definition in the snapshot. Available portions of the model remain usable."));return;}
      if(context.kind==="ports"){
        const ports=item[context.direction];$("card-kind").textContent=context.direction==="inputs"?"Input":"Output";
        if(ports.length===1&&entities.get(ports[0].dataStructure)?.category==="data"){
          const type=entities.get(ports[0].dataStructure);$("card-title").textContent=type.label;fieldsFor(type,body);body.append(disclosure("Port definition",node=>portList(ports,node,`${item.id}:${context.direction}`),"port-definition"));metadata(type,body,type.id);
          const related=edges.filter(e=>e.source===type.id||e.target===type.id);if(related.length)body.append(disclosure("Connections",node=>{for(const edge of related){const target=entities.get(edge.source===type.id?edge.target:edge.source);node.append(button(`${edge.label}: ${target.label}`,()=>target.category==="data"?openType(target.id):showCard({kind:"entity",id:target.id},state.cardOrigin),"type-link"));}},`${type.id}:connections`));
        }else{$("card-title").textContent=context.direction==="inputs"?"Inputs":"Outputs";portList(ports,body,`${item.id}:${context.direction}`);}
      }else{$("card-kind").textContent=item.category==="data"?"Data structure":"Process";$("card-title").textContent=item.label;entityContents(item,body);}
    }
    function matches(item,query,owner,evidence){const nested=[...item.inputs,...item.outputs,...item.fields],choices=[...choiceRecords(item),...nested.flatMap(choiceRecords)];const haystack=[item.label,item.description,item.process,...nested.flatMap(f=>[f.name,f.type]),...choices.map(d=>d.summary),...item.sources.map(s=>s.path)].join(" ").toLowerCase();return(!query||haystack.includes(query))&&(owner==="all"||item.provenance===owner||nested.some(f=>origin(f.provenance)===owner)||choices.some(d=>origin(d.origin)===owner))&&(evidence==="all"||(item.evidence||"unknown")===evidence);}
    function search(){const results=$("search-results");results.replaceChildren();const query=$("search").value.trim().toLowerCase(),owner=$("owner-filter").value,evidence=$("evidence-filter").value;const items=[...entities.values()].filter(item=>matches(item,query,owner,evidence));for(const item of items){const pick=button(item.label,()=>{$("find-dialog").close();if(item.category==="data")showCard({kind:"entity",id:item.id},"menu");else drill(item.id,"menu");},"search-result");pick.dataset.id=item.id;pick.append(el("small",null,item.category==="data"?"Data":"Process"));results.append(pick);}if(!items.length)results.append(el("p","empty-message","No matching items. Try another search or filter."));}
    function closeMenu(){$("more-menu").open=false;}
    function openFind(){interact();closeMenu();search();$("find-dialog").showModal();$("search").focus();}
    function aboutSection(title,values,format){const section=el("details","about-details");section.append(el("summary",null,title));let built=false;section.addEventListener("toggle",()=>{if(!section.open||built)return;built=true;const ul=el("ul");for(const value of values)ul.append(el("li",null,format(value)));if(!values.length)ul.append(el("li",null,"None recorded."));section.append(ul);});return section;}
    function openAbout(){
      interact();closeMenu();const content=$("about-content");content.replaceChildren();if(raw.project?.summary)content.append(el("p",null,raw.project.summary));
      const coverage=raw.coverage||{},counts=coverage.counts||{},history=raw.history||{};
      content.append(aboutSection("Coverage",[`${counts.inspected||0} of ${counts.eligible||0} eligible files inspected. ${coverage.complete?"Source coverage is complete.":"Source coverage is incomplete or unverified."}`,...list(coverage.files).map(f=>`${f.path} · ${f.status}${f.note?" · "+f.note:""}`)],text),
        aboutSection("Project history",[`${history.status||"unavailable"} · ${history.threadCount||0} project chats`,...list(history.warnings)],text),
        aboutSection("Excluded inputs",list(coverage.excluded),entry=>`${entry.path} · ${entry.reason}`),
        aboutSection("Notes and unresolved references",[...new Set(notes)],text),
        aboutSection("How to read this map",["Observed means read in source, not measured at runtime. Documented facts come from specifications. Inferred relationships are interpretations.","User, AI, Mixed, and Unknown record decision origin. An approved AI proposal keeps AI origin; approval is a separate record.","A parent's origin does not assign ownership to its children. Missing evidence stays Unknown.","This is an offline snapshot. Ask the plugin to refresh it when the project changes."],text));
      if(raw.project?.generatedAt)content.append(el("p","muted",`Snapshot: ${new Date(raw.project.generatedAt).toLocaleString()}`));$("about-dialog").showModal();
    }
    $("more-menu").querySelector("summary").dataset.focusKey="menu";
    $("back").addEventListener("click",goBack);$("scope-details").addEventListener("click",()=>showCard({kind:"entity",id:frame().id},"scope-details"));$("scope-details").dataset.focusKey="scope-details";
    $("card-close").addEventListener("click",()=>closeCard());$("card-back").addEventListener("click",()=>{if(state.cardTrail.length>1){state.cardTrail.pop();renderCard();$("card-title").focus({preventScroll:true});}});
    $("find-button").addEventListener("click",openFind);$("about-button").addEventListener("click",openAbout);$("close-find").addEventListener("click",()=>$("find-dialog").close());$("close-about").addEventListener("click",()=>$("about-dialog").close());
    for(const id of["search","owner-filter","evidence-filter"])$(id).addEventListener(id==="search"?"input":"change",search);
    $("overview-button").addEventListener("click",()=>{closeMenu();overview();});$("fit").addEventListener("click",()=>{interact();closeMenu();fit();});$("zoom-in").addEventListener("click",()=>{interact();zoom(1.2);});$("zoom-out").addEventListener("click",()=>{interact();zoom(1/1.2);});
    document.addEventListener("pointerdown",event=>{if(!$("more-menu").contains(event.target))closeMenu();});
    document.addEventListener("keydown",event=>{if($("find-dialog").open||$("about-dialog").open)return;if(event.key==="Escape"){if(!$("detail-card").hidden){event.preventDefault();closeCard();}else closeMenu();}if(event.key==="/"&&!event.target.matches("input,textarea,select")){event.preventDefault();openFind();}});
    graph.addEventListener("wheel",event=>{event.preventDefault();interact();const rect=graph.getBoundingClientRect();zoom(Math.exp(-event.deltaY*.0015),event.clientX-rect.left,event.clientY-rect.top);},{passive:false});
    graph.addEventListener("pointerdown",event=>{if(event.button!==0||event.target.closest("[data-focus-key]"))return;interact();state.pan={id:event.pointerId,x:event.clientX,y:event.clientY,cx:state.camera.x,cy:state.camera.y};graph.setPointerCapture(event.pointerId);graph.classList.add("panning");});
    graph.addEventListener("pointermove",event=>{if(!state.pan||state.pan.id!==event.pointerId)return;state.camera.x=state.pan.cx+event.clientX-state.pan.x;state.camera.y=state.pan.cy+event.clientY-state.pan.y;camera();saveCamera();});
    const endPan=()=>{state.pan=null;graph.classList.remove("panning");};for(const name of["pointerup","pointercancel","lostpointercapture"])graph.addEventListener(name,endPan);
    graph.addEventListener("keydown",event=>{if(event.target!==graph)return;const delta={ArrowLeft:[30,0],ArrowRight:[-30,0],ArrowUp:[0,30],ArrowDown:[0,-30]}[event.key];if(delta){event.preventDefault();interact();state.camera.x+=delta[0];state.camera.y+=delta[1];camera();saveCamera();}if(["+","=","-","Home"].includes(event.key)){event.preventDefault();interact();event.key==="Home"?fit():zoom(event.key==="-"?1/1.2:1.2);}});
    let resizeFrame;new ResizeObserver(()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{if((board.clientWidth<620)!==state.vertical)renderDiagram();else fit();});}).observe(board);
    renderDiagram();
  })();
  </script>
</body>
</html>
